# fly.toml app configuration file generated for comparator-app on 2026-06-14T23:17:39+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'comparator-app'
primary_region = 'cdg'

[build]

[env]
  PORT = '3000'
  SCOPES = 'write_app_proxy,write_metaobject_definitions,write_metaobjects,write_products'
  SHOPIFY_API_KEY = '734703f2dd0c9a1891e66a48f6457411'
  SHOPIFY_APP_URL = 'https://comparator-app.fly.dev'
  # SQLite sur le volume persistant (cf. [[mounts]] /data). Sans ça, Prisma
  # (schema en env("DATABASE_URL")) échoue au boot et les sessions seraient
  # perdues à chaque déploiement.
  DATABASE_URL = 'file:/data/dev.sqlite'

[processes]
  app = 'node ./dbsetup.js npm run docker-start'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
