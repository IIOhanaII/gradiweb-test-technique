# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "734703f2dd0c9a1891e66a48f6457411"
name = "comparator-app"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_app_proxy : requis pour enregistrer l'App Proxy (tracking, Partie C).
scopes = "write_metaobject_definitions,write_metaobjects,write_products,write_app_proxy"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

# App Proxy (Partie C) : le thème POST le tracking de comparaison en same-origin
# sur https://<boutique>/apps/comparator/track → Shopify le relaie vers <url>/track,
# soit la route /proxy/track de l'app. Permet d'écrire les stats côté serveur
# (Admin API) sans exposer de token au navigateur.
# `url` RELATIVE : Shopify y préfixe l'URL de l'app (tunnel en dev, host en deploy).
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "comparator"
